<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Remesas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-100 font-sans text-gray-900" x-data="dashboardApp()" x-init="init()">

  <!-- Encabezado con Filtros Jerárquicos -->
  <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex flex-col xl:flex-row xl:items-center justify-between gap-3">
      <h1 class="text-xl font-bold whitespace-nowrap">Visor de Remesas</h1>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 w-full xl:w-auto text-sm">
        <!-- 1. Asesor -->
        <div>
          <label class="block text-xs text-blue-200 mb-1 font-semibold">1. Asesor</label>
          <select x-model="asesorSeleccionado" @change="onFiltroPadreChange()" class="bg-blue-800 text-white p-2 rounded border border-blue-500 focus:outline-none w-full">
            <option value="">Todos los Asesores</option>
            <template x-for="a in asesores" :key="a.nombre_asesor">
              <option :value="a.nombre_asesor" x-text="a.nombre_asesor"></option>
            </template>
          </select>
        </div>

        <!-- 2. Rango de Fechas -->
        <div class="relative" @click.outside="fechaMenuAbierto = false">
          <label class="block text-xs text-blue-200 mb-1 font-semibold">2. Rango de Fechas</label>
          <button @click="fechaMenuAbierto = !fechaMenuAbierto" type="button" class="bg-blue-800 text-white p-2 rounded border border-blue-500 focus:outline-none w-full text-left flex justify-between items-center text-sm">
            <span x-text="obtenerTextoRangoFecha()" class="truncate"></span>
            <svg class="w-4 h-4 ml-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>

          <div x-show="fechaMenuAbierto" x-cloak class="absolute left-0 sm:right-0 sm:left-auto mt-2 w-72 bg-white text-gray-800 rounded-lg shadow-xl p-4 z-50 border border-gray-200 space-y-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Desde</label>
              <input type="date" x-model="fechaInicio" @change="onFiltroPadreChange()" class="w-full border p-1.5 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Hasta</label>
              <input type="date" x-model="fechaFin" @change="onFiltroPadreChange()" class="w-full border p-1.5 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex justify-between items-center pt-2 border-t">
              <button @click="limpiarFechas()" type="button" class="text-xs text-red-600 hover:underline font-semibold">Limpiar</button>
              <button @click="fechaMenuAbierto = false" type="button" class="px-3 py-1 bg-blue-600 text-white rounded text-xs font-semibold">Aplicar</button>
            </div>
          </div>
        </div>

        <!-- 3. Hash -->
        <div>
          <label class="block text-xs text-blue-200 mb-1 font-semibold">3. Hash (Filtrado)</label>
          <select x-model="hashSeleccionado" @change="cargarRemesas()" class="bg-blue-800 text-white p-2 rounded border border-blue-500 focus:outline-none w-full">
            <option value="">Todos los Hashes</option>
            <template x-for="h in hashes" :key="h.hash_corto">
              <option :value="h.hash_corto" x-text="h.hash_corto"></option>
            </template>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">
    <!-- Totales -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-600">
        <p class="text-xs text-gray-500 uppercase font-semibold">Total Operaciones</p>
        <p class="text-2xl font-bold" x-text="remesas.length"></p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-600">
        <p class="text-xs text-gray-500 uppercase font-semibold">Monto Acumulado</p>
        <p class="text-2xl font-bold" x-text="'$' + calcularTotal()"></p>
      </div>
    </div>

    <!-- Tabla -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b text-xs text-gray-500 uppercase">
          <tr>
            <th @click="ordenarPor('id')" class="p-3 cursor-pointer hover:bg-gray-100">ID</th>
            <th @click="ordenarPor('nombre_asesor')" class="p-3 cursor-pointer hover:bg-gray-100">Asesor</th>
            <th @click="ordenarPor('hash_corto')" class="p-3 cursor-pointer hover:bg-gray-100">Hash</th>
            <th @click="ordenarPor('monto')" class="p-3 cursor-pointer hover:bg-gray-100">Monto</th>
            <th @click="ordenarPor('estado')" class="p-3 cursor-pointer hover:bg-gray-100">Estado</th>
            <th class="p-3 text-right">Acción</th>
          </tr>
        </thead>
        <tbody class="divide-y text-sm">
          <template x-for="r in remesasOrdenadas" :key="r.id">
            <tr class="hover:bg-gray-50">
              <td class="p-3 font-semibold text-blue-600" x-text="'#' + r.id"></td>
              <td class="p-3" x-text="r.nombre_asesor"></td>
              <td class="p-3 font-mono text-xs text-gray-600" x-text="r.hash_corto || '-'"></td>
              <td class="p-3">$<span x-text="Number(r.monto || 0).toFixed(2)"></span></td>
              <td class="p-3"><span class="px-2 py-1 text-xs rounded font-semibold" :class="r.estado === 'P' || r.estado === 'Pendiente' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'" x-text="r.estado"></span></td>
              <td class="p-3 text-right">
                <button @click="abrirEditar(r)" class="text-blue-600 hover:underline font-semibold">Editar</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Rediseñado de Remesa -->
  <div x-show="modalAbierto" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-lg p-6 max-w-md w-full space-y-4 shadow-xl">
      
      <!-- Encabezado con Botones de Estado y Moneda arriba a la derecha -->
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-gray-800">Editar Registro #<span x-text="formEdit.id"></span></h3>
        <div class="flex gap-2 items-center">
          <!-- Moneda -->
          <span class="px-2.5 py-1 text-xs font-bold rounded bg-blue-100 text-blue-800 border border-blue-300" x-text="formEdit.moneda || 'USD'"></span>
          <!-- Estado -->
          <span class="px-2.5 py-1 text-xs font-bold rounded border" :class="formEdit.estado === 'P' || formEdit.estado === 'Pendiente' ? 'bg-yellow-100 text-yellow-800 border-yellow-300' : 'bg-green-100 text-green-800 border-green-300'" x-text="formEdit.estado || 'P'"></span>
        </div>
      </div>

      <!-- Campos Visibles por Defecto -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Titular</label>
          <input type="text" x-model="formEdit.titular" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Monto</label>
            <input type="number" step="0.01" x-model="formEdit.monto" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Número de Tasa</label>
            <input type="text" x-model="formEdit.tasa" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Moneda de Preferencia</label>
            <input type="text" x-model="formEdit.moneda" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Estado</label>
            <input type="text" x-model="formEdit.estado" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- Submenú Desplegable "Ver más..." -->
      <div class="pt-1">
        <button @click="verMas = !verMas" type="button" class="text-xs font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1 focus:outline-none">
          <span x-text="verMas ? 'Ver menos' : 'Ver más...'"></span>
          <svg class="w-3.5 h-3.5 transform transition-transform" :class="verMas ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
      </div>

      <!-- Campos Secundarios (Ocultos por defecto) -->
      <div x-show="verMas" x-cloak class="space-y-3 pt-3 border-t border-gray-100">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Fecha</label>
            <input type="text" x-model="formEdit.fecha_hora" readonly class="w-full border p-2 rounded text-sm bg-gray-50 text-gray-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Banco</label>
            <input type="text" x-model="formEdit.banco" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Timestamp</label>
            <input type="text" x-model="formEdit.timestamp" readonly class="w-full border p-2 rounded text-sm bg-gray-50 text-gray-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Link</label>
            <div class="flex gap-1">
              <input type="text" x-model="formEdit.hiperlink" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <template x-if="formEdit.hiperlink">
                <a :href="formEdit.hiperlink" target="_blank" class="p-2 bg-gray-100 hover:bg-gray-200 rounded border flex items-center justify-center text-blue-600" title="Abrir Link">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex justify-end gap-2 pt-3 border-t">
        <button @click="modalAbierto = false" class="px-4 py-2 border rounded text-sm font-semibold text-gray-600 hover:bg-gray-50">Cancelar</button>
        <button @click="guardarCambios()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-semibold">Guardar</button>
      </div>

    </div>
  </div>

  <script>
    function dashboardApp() {
      return {
        asesores: [],
        hashes: [],
        remesas: [],
        asesorSeleccionado: '',
        fechaInicio: '',
        fechaFin: '',
        hashSeleccionado: '',
        fechaMenuAbierto: false,
        modalAbierto: false,
        verMas: false, // Control del submenú
        
        sortCol: 'id',
        sortAsc: false,

        formEdit: { id: null, monto: 0, estado: '', titular: '', moneda: '', tasa: '', banco: '', fecha_hora: '', timestamp: '', hiperlink: '' },

        async init() {
          const resA = await fetch('/api/asesores');
          if (resA.ok) this.asesores = await resA.json();
          await this.onFiltroPadreChange();
        },

        ordenarPor(columna) {
          if (this.sortCol === columna) {
            this.sortAsc = !this.sortAsc;
          } else {
            this.sortCol = columna;
            this.sortAsc = true;
          }
        },

        get remesasOrdenadas() {
          return [...this.remesas].sort((a, b) => {
            let valA = a[this.sortCol];
            let valB = b[this.sortCol];

            if (this.sortCol === 'monto' || this.sortCol === 'id') {
              valA = Number(valA || 0);
              valB = Number(valB || 0);
            } else {
              valA = String(valA || '').toLowerCase();
              valB = String(valB || '').toLowerCase();
            }

            if (valA < valB) return this.sortAsc ? -1 : 1;
            if (valA > valB) return this.sortAsc ? 1 : -1;
            return 0;
          });
        },

        obtenerTextoRangoFecha() {
          if (this.fechaInicio && this.fechaFin) return `${this.fechaInicio} al ${this.fechaFin}`;
          if (this.fechaInicio) return `Desde ${this.fechaInicio}`;
          if (this.fechaFin) return `Hasta ${this.fechaFin}`;
          return 'Todas las fechas';
        },

        limpiarFechas() {
          this.fechaInicio = '';
          this.fechaFin = '';
          this.onFiltroPadreChange();
        },

        async onFiltroPadreChange() {
          this.hashSeleccionado = '';
          await this.cargarHashes();
          await this.cargarRemesas();
        },

        async cargarHashes() {
          const url = `/api/hashes?asesor=${encodeURIComponent(this.asesorSeleccionado)}&fechaInicio=${this.fechaInicio}&fechaFin=${this.fechaFin}`;
          const res = await fetch(url);
          if (res.ok) this.hashes = await res.json();
        },

        async cargarRemesas() {
          const url = `/api/remesas?asesor=${encodeURIComponent(this.asesorSeleccionado)}&fechaInicio=${this.fechaInicio}&fechaFin=${this.fechaFin}&hash=${encodeURIComponent(this.hashSeleccionado)}`;
          const res = await fetch(url);
          if (res.ok) this.remesas = await res.json();
        },

        calcularTotal() {
          const total = this.remesas.reduce((acc, r) => acc + Number(r.monto || 0), 0);
          return total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        abrirEditar(item) {
          this.formEdit = { ...item };
          this.verMas = false; // Resetear el acordeón cerrado al abrir
          this.modalAbierto = true;
        },

        async guardarCambios() {
          await fetch(`/api/remesas/${this.formEdit.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.formEdit)
          });
          this.modalAbierto = false;
          await this.cargarRemesas();
        }
      }
    }
  </script>
</body>
</html>
