<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Remesas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-100 font-sans text-gray-900" x-data="dashboardApp()" x-init="init()">

  <!-- Encabezado con Filtros Jerárquicos y Desplegable de Fechas -->
  <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex flex-col xl:flex-row xl:items-center justify-between gap-3">
      <h1 class="text-xl font-bold whitespace-nowrap">Visor de Remesas</h1>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 w-full xl:w-auto text-sm">
        
        <!-- 1. Asesor -->
        <div>
          <label class="block text-xs text-blue-200 mb-1 font-semibold">1. Asesor</label>
          <select 
            x-model="asesorSeleccionado" 
            @change="onFiltroPadreChange()" 
            class="bg-blue-800 text-white p-2 rounded border border-blue-500 focus:outline-none w-full"
          >
            <option value="">Todos los Asesores</option>
            <template x-for="a in asesores" :key="a.nombre_asesor">
              <option :value="a.nombre_asesor" x-text="a.nombre_asesor"></option>
            </template>
          </select>
        </div>

        <!-- 2. Rango de Fechas (Desplegable Doble Función Desde/Hasta) -->
        <div class="relative" @click.outside="fechaMenuAbierto = false">
          <label class="block text-xs text-blue-200 mb-1 font-semibold">2. Rango de Fechas</label>
          <button 
            @click="fechaMenuAbierto = !fechaMenuAbierto" 
            type="button"
            class="bg-blue-800 text-white p-2 rounded border border-blue-500 focus:outline-none w-full text-left flex justify-between items-center text-sm"
          >
            <span x-text="obtenerTextoRangoFecha()" class="truncate"></span>
            <svg class="w-4 h-4 ml-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>

          <!-- Panel flotante Desde/Hasta -->
          <div 
            x-show="fechaMenuAbierto" 
            x-cloak 
            class="absolute left-0 sm:right-0 sm:left-auto mt-2 w-72 bg-white text-gray-800 rounded-lg shadow-xl p-4 z-50 border border-gray-200 space-y-3"
          >
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Desde</label>
              <input 
                type="date" 
                x-model="fechaInicio" 
                @change="onFiltroPadreChange()" 
                class="w-full border p-1.5 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Hasta</label>
              <input 
                type="date" 
                x-model="fechaFin" 
                @change="onFiltroPadreChange()" 
                class="w-full border p-1.5 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
            </div>
            <div class="flex justify-between items-center pt-2 border-t">
              <button 
                @click="limpiarFechas()" 
                type="button" 
                class="text-xs text-red-600 hover:underline font-semibold"
              >
                Limpiar
              </button>
              <button 
                @click="fechaMenuAbierto = false" 
                type="button" 
                class="px-3 py-1 bg-blue-600 text-white rounded text-xs font-semibold"
              >
                Aplicar
              </button>
            </div>
          </div>
        </div>

        <!-- 3. Hash (Filtrado) -->
        <div>
          <label class="block text-xs text-blue-200 mb-1 font-semibold">3. Hash (Filtrado)</label>
          <select 
            x-model="hashSeleccionado" 
            @change="cargarRemesas()" 
            class="bg-blue-800 text-white p-2 rounded border border-blue-500 focus:outline-none w-full"
          >
            <option value="">Todos los Hashes</option>
            <template x-for="h in hashes" :key="h.hash_corto">
              <option :value="h.hash_corto" x-text="h.hash_corto"></option>
            </template>
          </select>
        </div>

      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">
    <!-- Métricas -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-600">
        <p class="text-xs text-gray-500 uppercase font-semibold">Total Operaciones</p>
        <p class="text-2xl font-bold" x-text="remesas.length"></p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-600">
        <p class="text-xs text-gray-500 uppercase font-semibold">Monto Acumulado</p>
        <p class="text-2xl font-bold" x-text="'$' + calcularTotal()"></p>
      </div>
    </div>

    <!-- Tabla de Registros -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <!-- Vista Móvil -->
      <div class="block md:hidden divide-y">
        <template x-for="r in remesasOrdenadas" :key="r.id">
          <div class="p-4 space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-blue-600" x-text="'#' + r.id"></span>
              <span class="px-2 py-1 text-xs rounded font-semibold" :class="r.estado === 'P' || r.estado === 'Pendiente' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'" x-text="r.estado"></span>
            </div>
            <p class="text-sm"><strong>Asesor:</strong> <span x-text="r.nombre_asesor"></span></p>
            <p class="text-sm"><strong>Hash:</strong> <span class="font-mono bg-gray-100 px-1 rounded text-xs" x-text="r.hash_corto || 'N/A'"></span></p>
            <p class="text-sm"><strong>Monto:</strong> $<span x-text="Number(r.monto || 0).toFixed(2)"></span></p>
            <button @click="abrirEditar(r)" class="w-full mt-2 bg-gray-100 hover:bg-gray-200 text-gray-800 py-1.5 rounded text-sm font-semibold">Editar</button>
          </div>
        </template>
      </div>

      <!-- Vista Escritorio con Ordenación por Columnas -->
      <table class="hidden md:table w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b text-xs text-gray-500 uppercase">
          <tr>
            <th @click="ordenarPor('id')" class="p-3 cursor-pointer select-none hover:bg-gray-100 transition-colors">
              <div class="flex items-center gap-1">
                <span>ID</span>
                <span class="text-xs" x-text="sortCol === 'id' ? (sortAsc ? '▲' : '▼') : '↕'"></span>
              </div>
            </th>
            <th @click="ordenarPor('nombre_asesor')" class="p-3 cursor-pointer select-none hover:bg-gray-100 transition-colors">
              <div class="flex items-center gap-1">
                <span>Asesor</span>
                <span class="text-xs" x-text="sortCol === 'nombre_asesor' ? (sortAsc ? '▲' : '▼') : '↕'"></span>
              </div>
            </th>
            <th @click="ordenarPor('hash_corto')" class="p-3 cursor-pointer select-none hover:bg-gray-100 transition-colors">
              <div class="flex items-center gap-1">
                <span>Hash Corto</span>
                <span class="text-xs" x-text="sortCol === 'hash_corto' ? (sortAsc ? '▲' : '▼') : '↕'"></span>
              </div>
            </th>
            <th @click="ordenarPor('monto')" class="p-3 cursor-pointer select-none hover:bg-gray-100 transition-colors">
              <div class="flex items-center gap-1">
                <span>Monto</span>
                <span class="text-xs" x-text="sortCol === 'monto' ? (sortAsc ? '▲' : '▼') : '↕'"></span>
              </div>
            </th>
            <th @click="ordenarPor('estado')" class="p-3 cursor-pointer select-none hover:bg-gray-100 transition-colors">
              <div class="flex items-center gap-1">
                <span>Estado</span>
                <span class="text-xs" x-text="sortCol === 'estado' ? (sortAsc ? '▲' : '▼') : '↕'"></span>
              </div>
            </th>
            <th class="p-3 text-right">Acción</th>
          </tr>
        </thead>
        <tbody class="divide-y text-sm">
          <template x-for="r in remesasOrdenadas" :key="r.id">
            <tr class="hover:bg-gray-50">
              <td class="p-3 font-semibold text-blue-600" x-text="'#' + r.id"></td>
              <td class="p-3" x-text="r.nombre_asesor"></td>
              <td class="p-3 font-mono text-xs text-gray-600" x-text="r.hash_corto || '-'"></td>
              <td class="p-3">$<span x-text="Number(r.monto || 0).toFixed(2)"></span></td>
              <td class="p-3"><span class="px-2 py-1 text-xs rounded font-semibold" :class="r.estado === 'P' || r.estado === 'Pendiente' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'" x-text="r.estado"></span></td>
              <td class="p-3 text-right">
                <button @click="abrirEditar(r)" class="text-blue-600 hover:underline font-semibold">Editar</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Edición -->
  <div x-show="modalAbierto" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-lg p-6 max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold">Editar Registro #<span x-text="formEdit.id"></span></h3>
      <div>
        <label class="block text-sm font-medium mb-1">Monto</label>
        <input type="number" step="0.01" x-model="formEdit.monto" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Estado</label>
        <input type="text" x-model="formEdit.estado" class="w-full border p-2 rounded">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button @click="modalAbierto = false" class="px-4 py-2 border rounded">Cancelar</button>
        <button @click="guardarCambios()" class="px-4 py-2 bg-blue-600 text-white rounded font-semibold">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    function dashboardApp() {
      return {
        asesores: [],
        hashes: [],
        remesas: [],
        asesorSeleccionado: '',
        fechaInicio: '',
        fechaFin: '',
        hashSeleccionado: '',
        fechaMenuAbierto: false,
        modalAbierto: false,
        
        // Estado de ordenación
        sortCol: 'id',
        sortAsc: false, // Por defecto IDs más recientes primero

        formEdit: { id: null, monto: 0, estado: '' },

        async init() {
          const resA = await fetch('/api/asesores');
          if (resA.ok) this.asesores = await resA.json();
          await this.onFiltroPadreChange();
        },

        // Manejo de ordenación al hacer clic en columnas
        ordenarPor(columna) {
          if (this.sortCol === columna) {
            this.sortAsc = !this.sortAsc;
          } else {
            this.sortCol = columna;
            this.sortAsc = true;
          }
        },

        // Propiedad computada para ordenar los datos reactivamente
        get remesasOrdenadas() {
          return [...this.remesas].sort((a, b) => {
            let valA = a[this.sortCol];
            let valB = b[this.sortCol];

            if (this.sortCol === 'monto' || this.sortCol === 'id') {
              valA = Number(valA || 0);
              valB = Number(valB || 0);
            } else {
              valA = String(valA || '').toLowerCase();
              valB = String(valB || '').toLowerCase();
            }

            if (valA < valB) return this.sortAsc ? -1 : 1;
            if (valA > valB) return this.sortAsc ? 1 : -1;
            return 0;
          });
        },

        // Texto informativo del botón desplegable de fecha
        obtenerTextoRangoFecha() {
          if (this.fechaInicio && this.fechaFin) return `${this.fechaInicio} al ${this.fechaFin}`;
          if (this.fechaInicio) return `Desde ${this.fechaInicio}`;
          if (this.fechaFin) return `Hasta ${this.fechaFin}`;
          return 'Todas las fechas';
        },

        limpiarFechas() {
          this.fechaInicio = '';
          this.fechaFin = '';
          this.onFiltroPadreChange();
        },

        async onFiltroPadreChange() {
          this.hashSeleccionado = '';
          await this.cargarHashes();
          await this.cargarRemesas();
        },

        async cargarHashes() {
          const url = `/api/hashes?asesor=${encodeURIComponent(this.asesorSeleccionado)}&fechaInicio=${this.fechaInicio}&fechaFin=${this.fechaFin}`;
          const res = await fetch(url);
          if (res.ok) this.hashes = await res.json();
        },

        async cargarRemesas() {
          const url = `/api/remesas?asesor=${encodeURIComponent(this.asesorSeleccionado)}&fechaInicio=${this.fechaInicio}&fechaFin=${this.fechaFin}&hash=${encodeURIComponent(this.hashSeleccionado)}`;
          const res = await fetch(url);
          if (res.ok) this.remesas = await res.json();
        },

        calcularTotal() {
          const total = this.remesas.reduce((acc, r) => acc + Number(r.monto || 0), 0);
          return total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },

        abrirEditar(item) {
          this.formEdit = { ...item };
          this.modalAbierto = true;
        },

        async guardarCambios() {
          await fetch(`/api/remesas/${this.formEdit.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.formEdit)
          });
          this.modalAbierto = false;
          await this.cargarRemesas();
        }
      }
    }
  </script>
</body>
</html>
