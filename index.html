<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Remesas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900" x-data="dashboardApp()" x-init="init()">

  <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3">
      <h1 class="text-xl font-bold">Visor de Remesas</h1>
      <select x-model="asesorSeleccionado" @change="cargarRemesas()" class="bg-blue-800 text-white p-2 rounded border border-blue-500 focus:outline-none w-full md:w-64">
        <option value="">Todos los Asesores</option>
        <template x-for="a in asesores" :key="a.nombre_asesor">
          <option :value="a.nombre_asesor" x-text="a.nombre_asesor"></option>
        </template>
      </select>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-600">
        <p class="text-xs text-gray-500 uppercase font-semibold">Total Operaciones</p>
        <p class="text-2xl font-bold" x-text="remesas.length"></p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-600">
        <p class="text-xs text-gray-500 uppercase font-semibold">Monto Acumulado</p>
        <p class="text-2xl font-bold" x-text="'$' + calcularTotal()"></p>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
      <div class="block md:hidden divide-y">
        <template x-for="r in remesas" :key="r.id">
          <div class="p-4 space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-blue-600" x-text="'#' + r.id"></span>
              <span class="px-2 py-1 text-xs rounded font-semibold" :class="r.estado === 'Completado' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'" x-text="r.estado"></span>
            </div>
            <p class="text-sm"><strong>Asesor:</strong> <span x-text="r.nombre_asesor"></span></p>
            <p class="text-sm"><strong>Monto:</strong> $<span x-text="r.monto"></span></p>
            <button @click="abrirEditar(r)" class="w-full mt-2 bg-gray-100 hover:bg-gray-200 text-gray-800 py-1.5 rounded text-sm font-semibold">Editar / Corregir</button>
          </div>
        </template>
      </div>

      <table class="hidden md:table w-full text-left border-collapse">
        <thead class="bg-gray-50 border-b text-xs text-gray-500 uppercase">
          <tr>
            <th class="p-3">ID</th>
            <th class="p-3">Asesor</th>
            <th class="p-3">Monto</th>
            <th class="p-3">Estado</th>
            <th class="p-3 text-right">Acción</th>
          </tr>
        </thead>
        <tbody class="divide-y text-sm">
          <template x-for="r in remesas" :key="r.id">
            <tr class="hover:bg-gray-50">
              <td class="p-3 font-semibold text-blue-600" x-text="'#' + r.id"></td>
              <td class="p-3" x-text="r.nombre_asesor"></td>
              <td class="p-3">$<span x-text="r.monto"></span></td>
              <td class="p-3"><span class="px-2 py-1 text-xs rounded font-semibold" :class="r.estado === 'Completado' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'" x-text="r.estado"></span></td>
              <td class="p-3 text-right">
                <button @click="abrirEditar(r)" class="text-blue-600 hover:underline font-semibold">Editar</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>

  <div x-show="modalAbierto" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-lg p-6 max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold">Editar Remesa #<span x-text="formEdit.id"></span></h3>
      <div>
        <label class="block text-sm font-medium mb-1">Monto</label>
        <input type="number" x-model="formEdit.monto" class="w-full border p-2 rounded">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Estado</label>
        <select x-model="formEdit.estado" class="w-full border p-2 rounded">
          <option value="Pendiente">Pendiente</option>
          <option value="Completado">Completado</option>
          <option value="Cancelado">Cancelado</option>
        </select>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button @click="modalAbierto = false" class="px-4 py-2 border rounded">Cancelar</button>
        <button @click="guardarCambios()" class="px-4 py-2 bg-blue-600 text-white rounded font-semibold">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    function dashboardApp() {
      return {
        asesores: [],
        remesas: [],
        asesorSeleccionado: '',
        modalAbierto: false,
        formEdit: { id: null, monto: 0, estado: '' },

        async init() {
          const resA = await fetch('/api/asesores');
          this.asesores = await resA.json();
          await this.cargarRemesas();
        },
        async cargarRemesas() {
          const res = await fetch(`/api/remesas?asesor=${encodeURIComponent(this.asesorSeleccionado)}`);
          this.remesas = await res.json();
        },
        calcularTotal() {
          return this.remesas.reduce((acc, r) => acc + Number(r.monto || 0), 0).toLocaleString();
        },
        abrirEditar(item) {
          this.formEdit = { ...item };
          this.modalAbierto = true;
        },
        async guardarCambios() {
          await fetch(`/api/remesas/${this.formEdit.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.formEdit)
          });
          this.modalAbierto = false;
          await this.cargarRemesas();
        }
      }
    }
  </script>
</body>
</html>
